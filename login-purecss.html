<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLE BCA PC Jabin Science College | Workflow Management System</title>
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: #FFFDF8;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: #555555;
  }

  .card {
    width: 100%;
    max-width: 28rem;
    background: #FFFDF8;
    border: 1px solid #E7DDD0;
    border-radius: 1.5rem;
    box-shadow: 0 20px 50px -12px rgba(122,31,43,0.12), 0 4px 16px rgba(43,43,43,0.04);
  }

  .card-body {
    padding: 2rem;
  }
  @media (min-width: 768px) {
    .card-body { padding: 2.5rem; }
  }

  /* Header */
  .header { text-align: center; margin-bottom: 2rem; }

  .logo-wrap {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 6rem;
    height: 6rem;
    margin-bottom: 1.5rem;
    background: #fff;
    border-radius: 9999px;
    border: 1px solid #E7DDD0;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    overflow: hidden;
  }
  .logo-wrap img { width: 100%; height: 100%; object-fit: cover; }

  .heading-serif {
    font-family: Georgia, 'Times New Roman', serif;
    color: #2B2B2B;
    font-size: 1.375rem;
    font-weight: 600;
    line-height: 1.3;
    margin: 0 0 0.25rem;
  }
  @media (min-width: 768px) { .heading-serif { font-size: 1.5rem; } }

  .subtitle {
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(122, 31, 43, 0.7);
    margin: 0;
  }

  /* Alerts */
  .alert {
    display: none;
    margin-bottom: 1.5rem;
    padding: 1rem;
    border-radius: 0.5rem;
    align-items: center;
    gap: 0.75rem;
    font-size: 0.875rem;
  }
  .alert.show { display: flex; }
  .alert-error {
    background: #FEF2F2;
    border: 1px solid #FEE2E2;
    color: #B91C1C;
  }
  .alert-success {
    background: #F0FDF4;
    border: 1px solid #DCFCE7;
    color: #15803D;
  }
  .alert iconify-icon { font-size: 1.125rem; flex-shrink: 0; }

  /* Form */
  form { display: flex; flex-direction: column; gap: 1.25rem; }

  .field-label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    color: #2B2B2B;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.5rem;
  }

  .input-wrap { position: relative; }

  .input-icon {
    position: absolute;
    top: 0; bottom: 0; left: 0;
    padding-left: 0.875rem;
    display: flex;
    align-items: center;
    color: #9CA3AF;
    pointer-events: none;
  }

  .input-field {
    display: block;
    width: 100%;
    padding: 0.75rem 1rem 0.75rem 2.5rem;
    background: rgba(247, 242, 232, 0.3);
    border: 1px solid #E7DDD0;
    border-radius: 0.75rem;
    color: #2B2B2B;
    font-size: 0.875rem;
    font-family: inherit;
    transition: all 0.15s ease;
  }
  .input-field.has-toggle { padding-right: 3rem; }
  .input-field::placeholder { color: rgba(85,85,85,0.4); }
  .input-field:focus {
    outline: none;
    border-color: #7A1F2B;
    box-shadow: 0 0 0 3px rgba(122, 31, 43, 0.12);
    background-color: #FFFFFF;
  }
  .input-field.field-error { border-color: #F87171; }

  .toggle-btn {
    position: absolute;
    top: 0; bottom: 0; right: 0;
    padding-right: 0.875rem;
    display: flex;
    align-items: center;
    background: none;
    border: none;
    cursor: pointer;
    color: #9CA3AF;
    transition: color 0.15s ease;
  }
  .toggle-btn:hover { color: #7A1F2B; }

  .field-error-text {
    display: none;
    font-size: 0.75rem;
    color: #DC2626;
    margin: 0.375rem 0 0 0.25rem;
  }
  .field-error-text.show { display: block; }

  /* Buttons */
  .btn-primary {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    background: #7A1F2B;
    color: #fff;
    font-weight: 600;
    font-size: 0.95rem;
    padding: 0.875rem;
    border: none;
    border-radius: 0.75rem;
    cursor: pointer;
    box-shadow: 0 10px 15px -3px rgba(122,31,43,0.2);
    transition: background 0.2s ease, transform 0.1s ease;
    font-family: inherit;
  }
  .btn-primary:hover { background: #5F1620; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

  .divider {
    position: relative;
    padding: 0.5rem 0;
    text-align: center;
  }
  .divider::before {
    content: "";
    position: absolute;
    top: 50%; left: 0; right: 0;
    border-top: 1px solid #E7DDD0;
  }
  .divider span {
    position: relative;
    background: #FFFDF8;
    padding: 0 0.75rem;
    font-size: 0.75rem;
    text-transform: uppercase;
    color: rgba(85,85,85,0.6);
    font-weight: 500;
  }

  .btn-google {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    background: #fff;
    border: 1px solid #E7DDD0;
    color: #2B2B2B;
    font-weight: 500;
    font-size: 0.9rem;
    padding: 0.75rem;
    border-radius: 0.75rem;
    cursor: pointer;
    transition: background 0.2s ease;
    font-family: inherit;
  }
  .btn-google:hover { background: #F9FAFB; }
  .btn-google iconify-icon { font-size: 1.125rem; }

  /* Loader */
  .loader {
    display: none;
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  .loader.show { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .btn-text.hide { display: none; }

  /* Footer */
  .footer {
    border-top: 1px solid #E7DDD0;
    padding: 1rem 2rem;
    text-align: center;
  }
  .footer p {
    margin: 0;
    font-size: 11px;
    line-height: 1.6;
    color: #8A8A8A;
    letter-spacing: 0.02em;
  }
  .footer span {
    color: rgba(122, 31, 43, 0.7);
    font-weight: 500;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="card-body">

      <div class="header">
        <div class="logo-wrap">
          <img
            src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/uploads/bbfdc233-0449-4911-abcd-0c4cacf856f0/1786163109378-69890758/Screenshot_2026-08-06_071836.png"
            alt="KLE Logo"
            onerror="this.onerror=null;this.src='https://placehold.co/600x400/1a1a1a/888?text=Logo';">
        </div>
        <h2 class="heading-serif">KLE BCA PC Jabin Science College</h2>
        <p class="subtitle">Workflow Management System</p>
      </div>

      <div id="error-alert" class="alert alert-error">
        <iconify-icon icon="lucide:alert-circle"></iconify-icon>
        <span id="error-message">Invalid credentials</span>
      </div>

      <div id="success-alert" class="alert alert-success">
        <iconify-icon icon="lucide:check-circle"></iconify-icon>
        <span id="success-message">Login successful</span>
      </div>

      <form id="login-form" novalidate>
        <div>
          <label for="email" class="field-label">Official Email Address</label>
          <div class="input-wrap">
            <span class="input-icon"><iconify-icon icon="lucide:mail"></iconify-icon></span>
            <input type="email" id="email" class="input-field" required placeholder="name@klejabin.edu.in">
          </div>
          <p id="email-error" class="field-error-text">Enter a valid email address.</p>
        </div>

        <div>
          <label for="password" class="field-label">Password</label>
          <div class="input-wrap">
            <span class="input-icon"><iconify-icon icon="lucide:lock"></iconify-icon></span>
            <input type="password" id="password" class="input-field has-toggle" required minlength="6" placeholder="••••••••">
            <button type="button" id="toggle-password" class="toggle-btn">
              <iconify-icon icon="lucide:eye" id="eye-icon"></iconify-icon>
            </button>
          </div>
          <p id="password-error" class="field-error-text">Password must be at least 6 characters.</p>
        </div>

        <button type="submit" id="login-btn" class="btn-primary">
          <span id="btn-text" class="btn-text">Login</span>
          <div id="btn-loader" class="loader"></div>
        </button>

        <div class="divider"><span>Or continue with</span></div>

        <button type="button" id="google-login-btn" class="btn-google">
          <iconify-icon icon="logos:google-icon"></iconify-icon>
          Continue with Google
        </button>
      </form>
    </div>

    <div class="footer">
      <p>© 2024 <span>KLE SOCIETY'S JABIN COLLEGE</span> &bull; INTERNAL ACCESS ONLY</p>
    </div>
  </div>

<script>
  const DEMO_USERS = {
    "admin@klejabin.edu.in": "admin123",
    "faculty@klejabin.edu.in": "faculty123",
    "anilkumar@klebca.in": "123456"
  };

  const form = document.getElementById('login-form');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const emailError = document.getElementById('email-error');
  const passwordError = document.getElementById('password-error');
  const errorAlert = document.getElementById('error-alert');
  const errorMessage = document.getElementById('error-message');
  const successAlert = document.getElementById('success-alert');
  const successMessage = document.getElementById('success-message');
  const loginBtn = document.getElementById('login-btn');
  const btnText = document.getElementById('btn-text');
  const btnLoader = document.getElementById('btn-loader');
  const togglePasswordBtn = document.getElementById('toggle-password');
  const eyeIcon = document.getElementById('eye-icon');
  const googleBtn = document.getElementById('google-login-btn');

  function hideAlerts() {
    errorAlert.classList.remove('show');
    successAlert.classList.remove('show');
  }

  function showError(message) {
    hideAlerts();
    errorMessage.textContent = message;
    errorAlert.classList.add('show');
  }

  function showSuccess(message) {
    hideAlerts();
    successMessage.textContent = message;
    successAlert.classList.add('show');
  }

  function setFieldError(input, errorEl, show) {
    input.classList.toggle('field-error', show);
    errorEl.classList.toggle('show', show);
  }

  function isValidEmail(value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  function setLoading(isLoading) {
    loginBtn.disabled = isLoading;
    btnText.classList.toggle('hide', isLoading);
    btnLoader.classList.toggle('show', isLoading);
  }

  togglePasswordBtn.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    eyeIcon.setAttribute('icon', isPassword ? 'lucide:eye-off' : 'lucide:eye');
  });

  emailInput.addEventListener('input', () => setFieldError(emailInput, emailError, false));
  passwordInput.addEventListener('input', () => setFieldError(passwordInput, passwordError, false));

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    hideAlerts();

    const email = emailInput.value.trim();
    const password = passwordInput.value;
    let valid = true;

    if (!isValidEmail(email)) {
      setFieldError(emailInput, emailError, true);
      valid = false;
    } else {
      setFieldError(emailInput, emailError, false);
    }

    if (password.length < 6) {
      setFieldError(passwordInput, passwordError, true);
      valid = false;
    } else {
      setFieldError(passwordInput, passwordError, false);
    }

    if (!valid) return;

    setLoading(true);

    setTimeout(() => {
      setLoading(false);
      const knownPassword = DEMO_USERS[email.toLowerCase()];
      if (knownPassword && knownPassword === password) {
        showSuccess('Login successful. Redirecting…');
        sessionStorage.setItem('kle_session', JSON.stringify({
          email: email,
          name: 'Dr. Anil Kumar',
          role: 'Teacher'
        }));
        setTimeout(() => {
          window.location.href = 'dashboard-purecss.html';
        }, 800);
      } else {
        showError('Invalid email or password. Please try again.');
      }
    }, 900);
  });

  googleBtn.addEventListener('click', () => {
    hideAlerts();
    showError('Google sign-in is not configured yet. Contact your administrator.');
  });
</script>
</body>
</html>
